name: Scheduled projection generation

on:
  workflow_dispatch:
    inputs:
      dataset_version_id:
        description: "Validated historical dataset version UUID"
        required: false
  schedule:
    - cron: "53 13 * * 3"

permissions:
  contents: read

concurrency:
  group: scheduled-projection-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TARGET_SEASON: ${{ vars.TARGET_SEASON || '2026' }}
      DATASET_VERSION_ID: ${{ inputs.dataset_version_id || vars.PROJECTION_DATASET_VERSION_ID }}
      PROJECTION_SCORING_CONFIG_JSON: ${{ vars.PROJECTION_SCORING_CONFIG_JSON }}
      CORRELATION_ID: projection-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -r pipelines/requirements.txt
      - name: Require explicit versioned projection inputs
        run: |
          test -n "$DATASET_VERSION_ID"
          test -n "$PROJECTION_SCORING_CONFIG_JSON"
      - name: Materialize non-secret scoring configuration
        run: printf '%s' "$PROJECTION_SCORING_CONFIG_JSON" > "$RUNNER_TEMP/projection-scoring.json"
      - name: Generate versioned projections
        shell: bash
        run: |
          set -o pipefail
          python pipelines/projections/run_projection.py \
            --target-season "$TARGET_SEASON" \
            --dataset-version-id "$DATASET_VERSION_ID" \
            --scoring-config "$RUNNER_TEMP/projection-scoring.json" \
            | tee projection-run-report.json
      - name: Upload model-run metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projection-run-report
          path: projection-run-report.json
          if-no-files-found: warn
