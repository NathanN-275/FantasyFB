name: Scheduled ADP ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: "41 11 * * *"

permissions:
  contents: read

concurrency:
  group: scheduled-adp-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
      TARGET_SEASON: ${{ vars.TARGET_SEASON || '2026' }}
      ADP_CONTEXTS_JSON: ${{ vars.ADP_CONTEXTS_JSON }}
      CORRELATION_ID: adp-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require explicit scoring and league-size contexts
        run: test -n "$ADP_CONTEXTS_JSON"
      - name: Apply portable PostgreSQL migrations
        run: pnpm db:migrate
      - name: Ingest configured ADP snapshots
        shell: bash
        run: |
          set -o pipefail
          pnpm adp:ingest | tee adp-ingestion-report.jsonl
      - name: Upload structured ingestion log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adp-ingestion-report
          path: adp-ingestion-report.jsonl
          if-no-files-found: warn
