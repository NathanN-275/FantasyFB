name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r pipelines/requirements-dev.txt
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm boundaries
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:python
      - run: pnpm build
      - name: Validate migration journal and SQL files
        run: pnpm db:migrations:check
      - name: Validate optional CI Neon connection
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
        run: pnpm db:validate
      - name: Apply migrations to the disposable CI database
        if: vars.ENABLE_CI_DATABASE_TESTS == 'true'
        env:
          TEST_DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
        run: pnpm --filter @fantasyfb/database exec vitest run src/migration-execution.test.ts
  browser-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fantasyfb/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
